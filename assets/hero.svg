<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="BRIELDEV - code · design · create">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset=".5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 0.22 0.12; 0 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx=".78" cy=".16" r=".7">
      <stop stop-color="#8B5CF6" stop-opacity=".32"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset=".4" stop-color="#6366F1" stop-opacity=".9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.1" fill="#27272A"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <clipPath id="round"><rect width="1200" height="300" rx="28"/></clipPath>
  </defs>

  <rect width="1200" height="300" rx="28" fill="#09090B"/>
  <rect width="1200" height="300" rx="28" fill="url(#grid)" opacity=".7"/>

  <g clip-path="url(#round)">
    <ellipse cx="985" cy="62" rx="270" ry="125" fill="#22D3EE" opacity=".08" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -45 26; 0 0" dur="13s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="205" cy="250" rx="290" ry="115" fill="#8B5CF6" opacity=".12" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 52 -22; 0 0" dur="15s" repeatCount="indefinite"/>
    </ellipse>

    <rect width="1200" height="300" fill="url(#glow)">
      <animate attributeName="opacity" values=".55;.9;.55" dur="6s" repeatCount="indefinite"/>
    </rect>

    <g transform="rotate(24 600 150)">
      <rect x="0" y="-150" width="420" height="600" fill="url(#sheen)">
        <animateTransform attributeName="transform" type="translate" values="-1500 0; 1600 0" dur="8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <path d="M0 252 C220 208 330 284 520 228 S868 172 1200 220" fill="none" stroke="url(#wave)" stroke-width="2" stroke-linecap="round" opacity=".8">
      <animate attributeName="opacity" values=".45;.95;.45" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M-200 268 C20 224 130 300 320 244 S668 186 1400 236" fill="none" stroke="#27272A" stroke-width="1.2" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="0;-120" dur="14s" repeatCount="indefinite"/>
    </path>
    <path d="M-200 268 C20 224 130 300 320 244 S668 186 1400 236" fill="none" stroke="url(#wave)" stroke-dasharray="5 16" stroke-width="1.6" stroke-linecap="round" opacity=".6">
      <animate attributeName="stroke-dashoffset" values="0;-210" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".3;.8;.3" dur="4.5s" repeatCount="indefinite"/>
    </path>

    <circle cx="1010" cy="76" r="3" fill="#A78BFA">
      <animate attributeName="cy" values="76;82;76" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="112" r="2" fill="#67E8F9">
      <animate attributeName="cy" values="112;106;112" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".15;.9;.15" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1090" cy="70" r="2" fill="#A78BFA">
      <animate attributeName="cy" values="70;77;70" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;1;.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930" cy="96" r="1.6" fill="#67E8F9">
      <animate attributeName="cy" values="96;102;96" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".1;.8;.1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1126" cy="124" r="1.8" fill="#A78BFA">
      <animate attributeName="cy" values="124;130;124" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".15;.9;.15" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="72" r="2" fill="#67E8F9">
      <animate attributeName="cy" values="72;78;72" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;1;.2" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="125" cy="96" r="1.5" fill="#A78BFA">
      <animate attributeName="cy" values="96;102;96" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".1;.8;.1" dur="4.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
    <text x="72" y="122" fill="url(#g)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5">BRIELDEV</text>
    <rect x="75" y="150" width="46" height="3" rx="2" fill="url(#g)">
      <animate attributeName="width" values="0;46" dur="1.2s" begin="0.6s" fill="freeze"/>
    </rect>
    <text x="75" y="189" fill="#A1A1AA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" letter-spacing="3">CODE&#160;·&#160;DESIGN&#160;·&#160;CREATE</text>
    <text x="75" y="224" fill="#71717A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing=".5">Ceará, Brasil · Informática · Tecnologia · Criação</text>
  </g>
