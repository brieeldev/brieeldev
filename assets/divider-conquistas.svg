<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 36" width="900" height="36" role="img" aria-label="Experiencias e conquistas">
  <defs>
    <linearGradient id="lineL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="lineR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8957e5"/>
      <stop offset="1" stop-color="#8957e5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5d6ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#a5d6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d2a8ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#d2a8ff" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#8957e5"/>
    </linearGradient>
    <clipPath id="trackL"><rect x="0" y="15" width="408" height="6"/></clipPath>
    <clipPath id="trackR"><rect x="492" y="15" width="408" height="6"/></clipPath>
  </defs>

  <rect x="0" y="17" width="408" height="2" rx="1" fill="url(#lineL)"/>
  <rect x="492" y="17" width="408" height="2" rx="1" fill="url(#lineR)"/>

  <g clip-path="url(#trackL)">
    <rect x="288" y="16" width="120" height="4" rx="2" fill="url(#glowL)">
      <animate attributeName="x" values="288;-120" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g clip-path="url(#trackR)">
    <rect x="492" y="16" width="120" height="4" rx="2" fill="url(#glowR)">
      <animate attributeName="x" values="492;900" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g fill="#1f6feb" transform="translate(424 18) scale(0.42)">
    <path d="M0 -12 C 2.5 -5, 5 -2.5, 12 -1 C 5 0.5, 2.5 3, 0 12 C -2.5 3, -5 0.5, -12 -1 C -5 -2.5, -2.5 -5, 0 -12 Z">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#8957e5" transform="translate(476 18) scale(0.42)">
    <path d="M0 -12 C 2.5 -5, 5 -2.5, 12 -1 C 5 0.5, 2.5 3, 0 12 C -2.5 3, -5 0.5, -12 -1 C -5 -2.5, -2.5 -5, 0 -12 Z">
      <animate attributeName="opacity" values="1;0.25;1" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(450 18)">
    <circle r="6" fill="none" stroke="#8957e5" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="6;16" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <path d="M0 -12 C 2.5 -5, 5 -2.5, 12 -1 C 5 0.5, 2.5 3, 0 12 C -2.5 3, -5 0.5, -12 -1 C -5 -2.5, -2.5 -5, 0 -12 Z" fill="url(#gem)"/>
  </g>
</svg>